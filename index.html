<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Kebiasaan Anak Indonesia Hebat</title>
    
    <!-- Mencegah error favicon.ico di browser -->
    <link rel="shortcut icon" href="#">

    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (XLSX) untuk Import & Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- STYLESHEET (CSS) -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7fe;
            color: #2b3674;
        }

        /* Loading Overlay Spinner */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(17, 28, 68, 0.6);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            color: #ffffff;
        }

        .spinner-icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
            animation: fa-spin 1.2s infinite linear;
        }

        /* Modal Login & Overlay */
        .login-modal, .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(17, 28, 68, 0.85);
            display: flex !important;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0px 15px 35px rgba(0, 0, 0, 0.2);
            text-align: left;
        }

        .login-card h2 {
            color: #4318ff;
            margin-bottom: 5px;
            text-align: center;
        }

        .login-card p {
            color: #707ebe;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e5f2;
            border-radius: 8px;
            outline: none;
            transition: border 0.2s;
            font-size: 0.95rem;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #4318ff;
        }

        /* Layout Utama */
        .app-container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* Sidebar Overlay (Mobile) */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
        }

        .sidebar-overlay.show {
            display: block;
        }

        /* Sidebar */
        .sidebar {
            width: 270px;
            background: #ffffff;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            color: #4318ff;
            margin-bottom: 20px;
        }

        .user-profile-summary {
            background: #f4f7fe;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .profile-avatar-container {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            overflow: hidden;
            border: 3px solid #4318ff;
            background: #e0e5f2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            background: #4318ff;
            color: white;
            font-size: 0.75rem;
            border-radius: 6px;
            font-weight: bold;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            color: #707ebe;
            text-decoration: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background-color: #4318ff;
            color: #ffffff;
        }

        .btn-logout {
            margin-top: 15px;
            padding: 12px;
            border: none;
            background: #ffecec;
            color: #ee5d50;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            width: 100%;
            text-align: center;
        }

        .btn-logout:hover {
            background: #ffd5d5;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto;
            width: 100%;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .toggle-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #2b3674;
        }

        .card {
            background: #ffffff;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.03);
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Tombol - Tombol Akses */
        .btn-primary {
            background: #4318ff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-primary:hover {
            background: #3311cc;
        }

        .btn-success {
            background: #01b574;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-success:hover {
            background: #009660;
        }

        .btn-warning {
            background: #ffb547;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-info {
            background: #00b5d8;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-danger {
            background: #ee5d50;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-danger:hover { background: #e03e2e; }

        /* Stats Grid & Table */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.02);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: #f4f7fe;
            color: #4318ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .custom-table th, .custom-table td {
            padding: 12px 15px;
            text-align: left;
            border: 1px solid #e0e5f2;
            font-size: 0.92rem;
        }

        .custom-table th {
            background-color: #f8fbff;
            color: #2b3674;
            font-weight: 600;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 5px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            cursor: pointer;
        }

        /* Area Cetak / Print Header */
        .print-header {
            display: none;
        }

        /* Style Khusus Tabel Hasil Cetak Jurnal */
        .print-journal-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            margin-top: 8px;
        }

        .print-journal-table th, .print-journal-table td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
            font-size: 0.9rem;
            color: #000;
        }

        .print-journal-table th {
            background-color: #f0f0f0;
            font-weight: bold;
            text-align: center;
        }

        /* Format Baru Cetak Per Siswa */
        .siswa-pemantauan-card {
            border: 1px solid #000;
            padding: 20px;
            margin-bottom: 30px;
            page-break-after: always;
            background: #fff;
        }

        .siswa-pemantauan-card:last-child {
            page-break-after: auto;
        }

        .print-pemantauan-header {
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            margin-bottom: 15px;
            line-height: 1.4;
            color: #000;
        }

        .info-siswa-table {
            width: 100%;
            margin-bottom: 15px;
            color: #000;
            font-size: 0.9rem;
        }

        .info-siswa-table td {
            padding: 3px 0;
            vertical-align: top;
        }

        .table-pemantauan {
            width: 100%;
            border-collapse: collapse;
            color: #000;
            font-size: 0.88rem;
        }

        .table-pemantauan th, .table-pemantauan td {
            border: 1px solid #000;
            padding: 8px 6px;
            text-align: center;
        }

        .table-pemantauan th {
            font-weight: bold;
            background-color: #f9f9f9;
        }

        .table-pemantauan td.indikator-col {
            text-align: left;
            padding-left: 10px;
        }

        .ttd-container {
            margin-top: 35px;
            display: flex;
            justify-content: space-between;
            color: #000;
            font-size: 0.9rem;
        }

        .ttd-box {
            text-align: center;
            width: 220px;
        }

        /* Input khusus Tanggal & Tempat TTD yang dapat di-edit */
        .editable-ttd-input {
            border: none;
            border-bottom: 1px dashed #777;
            text-align: center;
            font-size: 0.9rem;
            font-family: inherit;
            color: #000;
            background: transparent;
            width: 100%;
            padding: 2px 0;
            outline: none;
        }

        /* Style Kartu Login Siswa (Grid Print) */
        .cards-grid-print {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .siswa-card-box {
            border: 2px solid #4318ff;
            border-radius: 10px;
            padding: 12px;
            background: #fff;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .siswa-card-box h4 {
            color: #4318ff;
            font-size: 0.95rem;
            border-bottom: 1px solid #e0e5f2;
            padding-bottom: 5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .siswa-card-box table {
            width: 100%;
            font-size: 0.85rem;
        }

        .siswa-card-box table td {
            padding: 3px 0;
            border: none;
        }

        @media print {
            .sidebar, .top-bar, .btn-primary, .btn-success, .btn-danger, .btn-warning, .btn-info, form, .no-print {
                display: none !important;
            }
            .main-content {
                padding: 0;
            }
            .card {
                box-shadow: none;
                border: none;
                padding: 0;
            }
            .siswa-pemantauan-card {
                border: none !important;
                padding: 0 !important;
                margin-bottom: 0 !important;
            }
            .print-header {
                display: flex !important;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 20px;
                border-bottom: 3px double #000;
                padding-bottom: 10px;
            }
            .print-header img {
                max-height: 80px;
                width: auto;
            }
            .print-header .header-text {
                text-align: center;
                flex-grow: 1;
                padding: 0 10px;
            }
            .print-header h2 {
                font-size: 1.4rem;
                color: #000;
                margin-bottom: 4px;
            }
            .print-header p {
                font-size: 0.85rem;
                color: #000;
            }
            .print-journal-table th, .table-pemantauan th {
                background-color: #e0e0e0 !important;
                -webkit-print-color-adjust: exact;
            }
            .cards-grid-print {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .siswa-card-box {
                border: 1.5px solid #000 !important;
                page-break-inside: avoid;
            }
            .siswa-card-box h4 {
                color: #000 !important;
                border-bottom-color: #000 !important;
            }
            /* Menyembunyikan garis border input saat print agar rapi */
            .editable-ttd-input {
                border-bottom: none !important;
            }
            input[type="radio"] {
                accent-color: #000;
            }
        }

        /* Perbaikan Tampilan Sidebar Khusus Layar Mobil / HP */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -270px;
                top: 0;
                height: 100vh;
                z-index: 999;
                box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            }
            .sidebar.show {
                left: 0;
            }
        }
    </style>
</head>
<body>

    <!-- OVERLAY ANIMASI LOADING PROSES -->
    <div id="loadingOverlay" class="loading-overlay">
        <i class="fa-solid fa-circle-notch spinner-icon"></i>
        <h3 id="loadingText" style="font-weight: 500;">Memproses data...</h3>
    </div>

    <!-- MODAL LOGIN -->
    <div id="loginModal" class="login-modal">
        <div class="login-card">
            <h2><i class="fa-solid fa-graduation-cap"></i> Portal Masuk</h2>
            <p>Aplikasi 7 Kebiasaan Anak Indonesia Hebat</p>
            
            <form id="formLogin">
                <div class="form-group">
                    <label for="roleSelect">Masuk Sebagai:</label>
                    <select id="roleSelect">
                        <option value="admin">Admin Sekolah</option>
                        <option value="guru">Guru</option>
                        <option value="siswa" selected>Siswa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="usernameInput" id="labelUsername">NISN Siswa:</label>
                    <input type="text" id="usernameInput" placeholder="Masukkan NISN / ID..." required>
                </div>

                <div class="form-group">
                    <label for="passwordInput">Password:</label>
                    <input type="password" id="passwordInput" placeholder="Masukkan password..." required>
                </div>

                <!-- Tombol Lupa Password Admin -->
                <div id="forgotPasswordContainer" style="display: none; text-align: right; margin-top: -8px; margin-bottom: 12px;">
                    <a href="javascript:void(0)" onclick="window.modalLupaPasswordAdmin()" style="color: #4318ff; font-size: 0.85rem; text-decoration: none; font-weight: 600;">Lupa Password Admin?</a>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 5px; padding: 12px; font-size: 1rem; justify-content: center;">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk Aplikasi
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL EDIT SISWA (OLEH ADMIN/GURU) -->
    <div id="editSiswaModal" class="login-modal" style="display: none !important;">
        <div class="login-card">
            <h2><i class="fa-solid fa-user-pen"></i> Edit Data Siswa</h2>
            <form id="formEditSiswa" onsubmit="window.simpanEditSiswa(event)">
                <input type="hidden" id="editSiswaDocId">
                <div class="form-group">
                    <label>NISN Siswa:</label>
                    <input type="text" id="editNisnSiswa" required>
                </div>
                <div class="form-group">
                    <label>Nama Siswa:</label>
                    <input type="text" id="editNamaSiswa" required>
                </div>
                <div class="form-group">
                    <label>Kelas:</label>
                    <input type="text" id="editKelasSiswa" required>
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="text" id="editPassSiswa" required>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="btn-primary" style="flex: 1; justify-content: center;">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan
                    </button>
                    <button type="button" class="btn-danger" style="flex: 1; justify-content: center;" onclick="window.tutupEditSiswaModal()">
                        Batal
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL EDIT GURU (OLEH ADMIN) -->
    <div id="editGuruModal" class="login-modal" style="display: none !important;">
        <div class="login-card">
            <h2><i class="fa-solid fa-user-pen"></i> Edit Data Guru</h2>
            <form id="formEditGuru" onsubmit="window.simpanEditGuru(event)">
                <input type="hidden" id="editGuruDocId">
                <div class="form-group">
                    <label>Username Guru:</label>
                    <input type="text" id="editUsernameGuru" required>
                </div>
                <div class="form-group">
                    <label>NIP Guru:</label>
                    <input type="text" id="editNipGuru" placeholder="Isi NIP Guru">
                </div>
                <div class="form-group">
                    <label>Nama Lengkap Guru:</label>
                    <input type="text" id="editNamaGuru" required>
                </div>
                <div class="form-group">
                    <label>Wali Kelas:</label>
                    <input type="text" id="editWaliKelasGuru" placeholder="Isi kelas jika Wali Kelas">
                </div>
                <div class="form-group">
                    <label>Password Akun:</label>
                    <input type="text" id="editPassGuru" required>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="btn-primary" style="flex: 1; justify-content: center;">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan
                    </button>
                    <button type="button" class="btn-danger" style="flex: 1; justify-content: center;" onclick="window.tutupEditGuruModal()">
                        Batal
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL EDIT PROFIL MANDIRI SISWA (FOTO, NAMA, PASSWORD) -->
    <div id="editProfilSiswaModal" class="login-modal" style="display: none !important;">
        <div class="login-card">
            <h2><i class="fa-solid fa-id-badge"></i> Edit Profil Saya</h2>
            <form id="formEditProfilSiswa" onsubmit="window.simpanProfilSiswaMandiri(event)">
                <div class="form-group" style="text-align: center;">
                    <div class="profile-avatar-container" style="width: 90px; height: 90px;">
                        <img id="previewFotoProfil" src="https://via.placeholder.com/150?text=Foto" alt="Foto Profil">
                    </div>
                    <label for="inputFotoProfil" style="cursor: pointer; color: #4318ff; font-size: 0.85rem;">
                        <i class="fa-solid fa-camera"></i> Ubah Foto Profil
                    </label>
                    <input type="file" id="inputFotoProfil" accept="image/*" style="display: none;" onchange="window.previewFotoProfilSelected(event)">
                </div>

                <div class="form-group">
                    <label>Nama Lengkap:</label>
                    <input type="text" id="profilNamaSiswa" required>
                </div>

                <div class="form-group">
                    <label>Password Baru (Kosongkan jika tidak diubah):</label>
                    <input type="password" id="profilPassSiswa" placeholder="Masukkan password baru...">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="btn-primary" style="flex: 1; justify-content: center;">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan
                    </button>
                    <button type="button" class="btn-danger" style="flex: 1; justify-content: center;" onclick="window.tutupEditProfilSiswaModal()">
                        Batal
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL EDIT PROFIL GURU (FOTO, NAMA, PASSWORD) -->
    <div id="editProfilGuruModal" class="login-modal" style="display: none !important;">
        <div class="login-card">
            <h2><i class="fa-solid fa-user-pen"></i> Edit Profil Guru</h2>
            <form id="formEditProfilGuru" onsubmit="window.simpanProfilGuruMandiri(event)">
                <div class="form-group" style="text-align: center;">
                    <div class="profile-avatar-container" style="width: 90px; height: 90px;">
                        <img id="previewFotoProfilGuru" src="https://via.placeholder.com/150?text=Guru" alt="Foto Profil Guru">
                    </div>
                    <label for="inputFotoProfilGuru" style="cursor: pointer; color: #4318ff; font-size: 0.85rem;">
                        <i class="fa-solid fa-camera"></i> Unggah / Ubah Foto Profil
                    </label>
                    <input type="file" id="inputFotoProfilGuru" accept="image/*" style="display: none;" onchange="window.previewFotoProfilGuruSelected(event)">
                </div>

                <div class="form-group">
                    <label>Nama Lengkap Guru:</label>
                    <input type="text" id="profilNamaGuru" required>
                </div>

                <div class="form-group">
                    <label>Password Baru (Kosongkan jika tidak diubah):</label>
                    <input type="password" id="profilPassGuru" placeholder="Masukkan password baru...">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="btn-primary" style="flex: 1; justify-content: center;">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan
                    </button>

        // Helper Tanggal & Hari
        function getHariIndo(dateStr) {
            if (!dateStr) return '-';
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const d = new Date(dateStr);
            return isNaN(d.getDay()) ? dateStr : days[d.getDay()];
        }

        // Helper Format Tanggal Lengkap (Hari, Tanggal Bulan Tahun)
        function formatTanggalLengkap(dateStr) {
            if (!dateStr) return '-';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]) - 1;
            const day = parseInt(parts[2]);
            
            const d = new Date(year, month, day);
            if (isNaN(d.getTime())) return dateStr;

            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

            const namaHari = days[d.getDay()];
            const tgl = d.getDate() < 10 ? '0' + d.getDate() : d.getDate();
            const namaBulan = monthNames[d.getMonth()];

            return `${namaHari}, ${tgl} ${namaBulan} ${d.getFullYear()}`;
        }

        // -------------------------------------------------------------

                }

                const [yr, mo] = bulan.split('-');
                const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                const namaBulanIndo = monthNames[parseInt(mo) - 1] + " " + yr;

                // Menggunakan formatTanggalLengkap(dateStr)
                const categories = [
                    { key: 'bangun-pagi', name: '1. Bangun Pagi', headers: ['Hari / Tanggal', 'Jam Bangun'], renderRow: (d) => `<td>${formatTanggalLengkap(d.tanggal)}</td><td>${d.jam} WITA/WIB</td>` },
                    { key: 'berolahraga', name: '2. Berolahraga', headers: ['Hari / Tanggal', 'Jenis Olahraga', 'Durasi', 'Keterangan'], renderRow: (d) => `<td>${formatTanggalLengkap(d.tanggal)}</td><td>${d.jenis}</td><td>${d.durasi}</td><td>${d.keterangan || '-'}</td>` },
                    { key: 'beribadah', name: '3. Beribadah', headers: ['Hari / Tanggal', 'Shalat Wajib', 'Shalat Sunnah', 'Keterangan'], renderRow: (d) => `<td>${formatTanggalLengkap(d.tanggal)}</td><td>${(d.wajib || []).join(', ') || '-'}</td><td>${(d.sunnah || []).join(', ') || '-'}</td><td>${d.keterangan || '-'}</td>` },
                    { key: 'makan-sehat', name: '4. Makan Sehat', headers: ['Hari / Tanggal', 'Menu Makanan', 'Keterangan'], renderRow: (d) => `<td>${formatTanggalLengkap(d.tanggal)}</td><td>${d.menu}</td><td>${d.keterangan || '-'}</td>` },
                    { key: 'gemar-belajar', name: '5. Gemar Belajar', headers: ['Hari / Tanggal', 'Materi', 'Kesimpulan'], renderRow: (d) => `<td>${formatTanggalLengkap(d.tanggal)}</td><td>${d.materi}</td><td>${d.kesimpulan}</td>` },

                    { key: 'tidur-cepat', name: '7. Tidur Cepat', headers: ['Hari / Tanggal', 'Jam Tidur', 'Keterangan'], renderRow: (d) => `<td>${formatTanggalLengkap(d.tanggal)}</td><td>${d.jamTidur}</td><td>${d.keterangan || '-'}</td>` }
                ];

                let tablesHTML = "";

                for (const cat of categories) {
                    const qCat = query(collection(db, `kategori_${cat.key}`), where("siswaId", "==", sId));
                    const snapCat = await getDocs(qCat);

                    let records = [];
                    snapCat.forEach(d => {

                    let thCols = cat.headers.map(h => `<th>${h}</th>`).join('');
                    let trRows = "";

                        trRows = `<tr><td colspan="${cat.headers.length}" style="text-align:center; font-style:italic; color:#666;">Belum ada catatan pada bulan ini.</td></tr>`;
                    } else {

                    <div style="margin-bottom:15px; border-bottom:1px dashed #ccc; padding-bottom:10px;">

                        <table style="width:100%; font-size:0.95rem; color:#000;">
                            <tr><td style="width:120px; font-weight:bold;">Nama Siswa</td><td>: ${sData.nama}</td><td style="width:100px; font-weight:bold;">Kelas</td><td>: ${sData.kelas || '-'}</td></tr>
                            <tr><td style="font-weight:bold;">NISN</td><td>: ${sData.nisn}</td><td style="font-weight:bold;">Bulan / Tahun</td><td>: ${namaBulanIndo}</td></tr>
                        </table>
                    </div>

                    ${tablesHTML}

                    <div class="ttd-container">
                        <div class="ttd-box">
                            <br>
                            Mengetahui,<br>
                            Orang Tua / Wali Siswa
                            <br><br><br><br>
                            <strong>........................................</strong>
                        </div>
                        <div class="ttd-box">
                            <input type="text" class="editable-ttd-input" value="${defaultTglTtd}" title="Klik untuk mengubah tempat & tanggal"><br>
                            Wali Kelas ${sData.kelas || ''}

                            <strong>........................................</strong>
                        </div>

                hideLoading();
            }

        // -------------------------------------------------------------
        // LOGIKA PENYESUAIAN CETAK HASIL PEMANTAUAN
        // -------------------------------------------------------------
        window.daftarSiswaPemantauan = [];

        window.tampilkanHasilPemantauan = async function() {
            const kelas = document.getElementById('filterPemantauanKelas')?.value;
            const bulan = document.getElementById('filterPemantauanBulan')?.value;
            const container = document.getElementById('previewHasilPemantauan');

                container.innerHTML = `<p style="text-align:center;" class="card">Silakan pilih kelas dan bulan.</p>`;

            }

                const schoolDoc = await getDoc(doc(db, "pengaturan", "sekolah"));
                const sch = schoolDoc.exists() ? schoolDoc.data() : {};

                // Ambil daftar siswa berdasarkan kelas
                const qSiswa = query(collection(db, "data_siswa"), where("kelas", "==", kelas));

                    container.innerHTML = `<p style="text-align:center; padding:20px;" class="card">Tidak ada data siswa pada kelas ${kelas}.</p>`;

                hideLoading();
            }

        window.renderIndividuPemantauan = async function(sch, kelas, bulan) {
            const container = document.getElementById('previewHasilPemantauan');
            const daftarSiswa = window.daftarSiswaPemantauan;
            if (!daftarSiswa || daftarSiswa.length === 0) return;

            const siswa = daftarSiswa[currentSiswaIndex];

            const categoriesList = [
                { key: 'bangun-pagi', label: '1. Bangun Pagi' },
                { key: 'berolahraga', label: '2. Berolahraga' },
                { key: 'beribadah', label: '3. Beribadah' },
                { key: 'makan-sehat', label: '4. Makan Sehat' },
                { key: 'gemar-belajar', label: '5. Gemar Belajar' },
                { key: 'bermasyarakat', label: '6. Bermasyarakat' },
                { key: 'tidur-cepat', label: '7. Tidur Cepat' }
            ];

            const [yr, mo] = bulan.split('-');
            const totalDaysInMonth = new Date(parseInt(yr), parseInt(mo), 0).getDate();

            const monthNames = ["JANUARI", "FEBRUARI", "MARET", "APRIL", "MEI", "JUNI", "JULI", "AGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DESEMBER"];
            const namaBulanIndo = monthNames[parseInt(mo) - 1] + " " + yr;

            // Cari Nama & NIP Guru Wali Kelas
            let namaGuruWali = currentUser.role === 'guru' ? currentUser.name : '.........................';
            let nipGuruWali = currentUser.role === 'guru' ? (currentUser.nip || currentUser.id || '') : '';

            if (currentUser.role === 'admin') {
                const guruSnap = await getDocs(query(collection(db, "data_guru"), where("waliKelas", "==", kelas)));
                if (!guruSnap.empty) {
                    const gData = guruSnap.docs[0].data();
                    namaGuruWali = gData.nama || '.........................';
                    nipGuruWali = gData.nip || '';
                }
            }

            const nipKepsekDisplay = sch.nipKepalaSekolah ? `NIP. ${sch.nipKepalaSekolah}` : 'NIP. -';
            const nipGuruDisplay = nipGuruWali ? `NIP. ${nipGuruWali}` : 'NIP. -';

            let siswaOptionsNav = "";
            daftarSiswa.forEach((s, idx) => {
                siswaOptionsNav += `<option value="${idx}" ${idx === currentSiswaIndex ? 'selected' : ''}>${idx + 1}. ${s.nama}</option>`;
            });

            let rowsIndikator = '';
            for (let j = 0; j < categoriesList.length; j++) {
                const cat = categoriesList[j];
                const qCat = query(collection(db, `kategori_${cat.key}`), where("siswaId", "==", siswa.id));
                const catSnap = await getDocs(qCat);
                
                let countInMonth = 0;
                catSnap.forEach(docCat => {
                    const d = docCat.data();

                        countInMonth++;
                    }
                });

                let avgPercentage = Math.round((countInMonth / totalDaysInMonth) * 100);
                const isSudah = avgPercentage >= 50;
                const radioName = `ind_${siswa.id}_${j}`;

                rowsIndikator += `
                    <tr>
                        <td>${j + 1}</td>
                        <td class="indikator-col">${cat.label}</td>
                        <td>
                            <input type="radio" name="${radioName}" value="belum" ${!isSudah ? 'checked' : ''}>
                        </td>
                        <td>
                            <input type="radio" name="${radioName}" value="sudah" ${isSudah ? 'checked' : ''}>
                        </td>

            container.innerHTML = `
                <div class="card no-print" style="margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">

                            ${siswaOptionsNav}
                        </select>
                        <button class="btn-primary" onclick="window.navigasiSiswaPemantauan(1)" ${currentSiswaIndex === daftarSiswa.length - 1 ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>
                            Selanjutnya <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                    <div>
                        <span class="badge" style="background:#4318ff; font-size: 0.85rem; padding: 6px 12px;">Siswa ${currentSiswaIndex + 1} dari ${daftarSiswa.length}</span>
                    </div>
                </div>

                <div class="siswa-pemantauan-card">
                    <div class="print-pemantauan-header">
                        HASIL PEMANTAUAN KEBIASAAN ANAK INDONESIA HEBAT<br>
                        ${(sch.namaSekolah || 'SD NEGERI 1 INDONESIA').toUpperCase()}<br>
                        BULAN: ${namaBulanIndo}
                    </div>

                    <table class="info-siswa-table">
                        <tr>
                            <td style="width: 120px; font-weight: bold;">NAMA SISWA</td>
                            <td>: ${siswa.nama.toUpperCase()}</td>
                            <td style="width: 80px; font-weight: bold;">KELAS</td>
                            <td>: ${kelas.toUpperCase()}</td>
                        </tr>
                        <tr>
                            <td style="font-weight: bold;">NISN</td>
                            <td>: ${siswa.nisn || '-'}</td>
                            <td style="font-weight: bold;">PERIODE</td>
                            <td>: ${namaBulanIndo}</td>
                        </tr>
                    </table>

                    <table class="table-pemantauan">

                            <tr>
                                <th style="width:40px;">NO</th>

                                <th style="width:140px;">BELUM TERBIASA</th>

                        <tbody>

                            <br><br><br><br>
                            <strong>........................................</strong>
                        </div>
                        <div class="ttd-box">
                            <br>
                            Mengetahui,<br>
                            Kepala Sekolah
                            <br><br><br><br>

                            <br><br><br><br>
                            <strong>${namaGuruWali}</strong><br>
                            ${nipGuruDisplay}
                        </div>
                    </div>
                </div>
            `;
        };

            const bulan = document.getElementById('filterPemantauanBulan')?.value;

            const tbody = document.getElementById('tbodyGuruList');

            const searchVal = (document.getElementById('searchGuruInput')?.value || '').toLowerCase();

            const filtered = allGuruCache.filter(g => {
                const matchUser = g.username && g.username.toLowerCase().includes(searchVal);
                const matchNip = g.nip && g.nip.toLowerCase().includes(searchVal);
                const matchNama = g.nama && g.nama.toLowerCase().includes(searchVal);
                return matchUser || matchNip || matchNama;
            });

            let rows = "";
            filtered.forEach(d => {
                rows += `

                        <td>${d.nip || '-'}</td>

                            <button class="btn-danger" onclick="window.hapusData('data_guru', '${d.id}', 'kelola-guru')">
                                <i class="fa-solid fa-trash"></i> Hapus
                            </button>
                        </td>

            tbody.innerHTML = rows || '<tr><td colspan="6" style="text-align:center;">Data guru tidak ditemukan.</td></tr>';

            document.getElementById('editGuruDocId').value = item.id;
            document.getElementById('editUsernameGuru').value = item.username || item.nip || '';
            document.getElementById('editNipGuru').value = item.nip || '';
            document.getElementById('editNamaGuru').value = item.nama || '';
            document.getElementById('editWaliKelasGuru').value = item.waliKelas || '';
            document.getElementById('editPassGuru').value = item.password || '';

            const modal = document.getElementById('editGuruModal');
            modal.style.setProperty('display', 'flex', 'important');

        window.renderTabelSiswaFiltered = function() {
            const tbody = document.getElementById('tbodySiswaList');
            if (!tbody) return;

            const searchVal = (document.getElementById('searchSiswaInput')?.value || '').toLowerCase();
            const filterKelas = (document.getElementById('filterKelasSiswaAdmin')?.value || 'semua');

            const filtered = allSiswaCache.filter(s => {
                const matchSearch = (s.nisn && s.nisn.toLowerCase().includes(searchVal)) || 
                                    (s.nama && s.nama.toLowerCase().includes(searchVal));
                const matchKelas = (filterKelas === 'semua' || s.kelas === filterKelas);
                return matchSearch && matchKelas;
            });

            let rows = "";
            filtered.forEach(d => {
                rows += `
                    <tr>
                        <td style="text-align: center;">
                            <input type="checkbox" class="check-siswa-item" value="${d.id}">
                        </td>
                        <td><strong>${d.nisn}</strong></td>

                        <td>${d.kelas || '-'}</td>

                            </button>
                            <button class="btn-info" onclick="window.resetPasswordSiswaByAdmin('${d.id}', '${d.nisn}')">

                            </button>
                            <button class="btn-danger" onclick="window.hapusData('data_siswa', '${d.id}', 'kelola-siswa')">
                                <i class="fa-solid fa-trash"></i> Hapus
                            </button>
                        </td>
                    </tr>
                `;
            });

        // SIMPAN KEBIASAAN SISWA
        window.simpanKebiasaan = async function(e, type) {
            e.preventDefault();
            if (!currentUser) return;

            let payload = {
                siswaId: currentUser.id,
                nisn: currentUser.nisn,
                namaSiswa: currentUser.name,
                tanggal: document.getElementById('kDate').value,
                createdAt: new Date().toISOString()
            };

            if (type === 'bangun-pagi') {
                payload.jam = document.getElementById('kJam').value;
            } else if (type === 'berolahraga') {
                payload.jenis = document.getElementById('kJenis').value;
                payload.durasi = document.getElementById('kDurasi').value;
                payload.keterangan = document.getElementById('kKet').value;
            } else if (type === 'beribadah') {
                const wajibArr = Array.from(document.querySelectorAll('.check-wajib:checked')).map(c => c.value);
                const sunnahArr = Array.from(document.querySelectorAll('.check-sunnah:checked')).map(c => c.value);
                payload.wajib = wajibArr;
                payload.sunnah = sunnahArr;
                payload.keterangan = document.getElementById('kKet').value;
            } else if (type === 'makan-sehat') {
                payload.menu = document.getElementById('kMenu').value;
                payload.keterangan = document.getElementById('kKet').value;
            } else if (type === 'gemar-belajar') {
                payload.materi = document.getElementById('kMateri').value;
                payload.kesimpulan = document.getElementById('kKesimpulan').value;
            } else if (type === 'bermasyarakat') {
                payload.kegiatan = document.getElementById('kKegiatan').value;
                payload.keterangan = document.getElementById('kKet').value;
            } else if (type === 'tidur-cepat') {
                payload.jamTidur = document.getElementById('kJamTidur').value;
                payload.keterangan = document.getElementById('kKet').value;
            }

            showLoading("Menyimpan catatan kebiasaan...");
            try {
                await addDoc(collection(db, `kategori_${type}`), payload);
                alert("Catatan kebiasaan berhasil disimpan!");
                window.loadPage(`kebiasaan-${type}`, null, false);
            } catch (err) {
                alert("Gagal menyimpan data: " + err.message);
            } finally {
                hideLoading();
            }
        };

                alert("Gagal menambahkan guru: " + err.message);
            } finally {
                hideLoading();
            }
        };

        // TAMBAH SISWA MANUAL
        window.tambahSiswa = async function(e) {
            e.preventDefault();
            const nisn = document.getElementById('addNisnSiswa').value.trim();
            const nama = document.getElementById('addNamaSiswa').value.trim();
            const kelas = document.getElementById('addKelasSiswa').value.trim();
            const password = document.getElementById('addPassSiswa').value.trim();

            showLoading("Menambahkan data siswa...");
            try {
                await addDoc(collection(db, "data_siswa"), {
                    nisn,
                    nama,
                    kelas,
                    password
                });
                alert("Siswa berhasil ditambahkan!");
                window.loadPage('kelola-siswa', null, false);
            } catch (err) {
                alert("Gagal menambahkan siswa: " + err.message);
            } finally {
                hideLoading();
            }
        };

        // IMPORT SISWA DARI FILE EXCEL
        window.downloadTemplateExcel = function() {
            const dataTemplate = [
                ["NISN", "NAMA", "KELAS", "PASSWORD"],
                ["1234567890", "Budi Santoso", "Kelas 5A", "123456"],
                ["1234567891", "Siti Aminah", "Kelas 5A", "123456"]
            ];
            const ws = XLSX.utils.aoa_to_sheet(dataTemplate);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Template Siswa");
            XLSX.writeFile(wb, "Template_Data_Siswa.xlsx");
        };

        window.importExcelSiswa = function() {
            const fileInput = document.getElementById('excelFileInput');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("Pilih file Excel terlebih dahulu!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            showLoading("Membaca data Excel...");

            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheet];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (jsonData.length <= 1) {
                        alert("File Excel kosong atau format tidak sesuai!");
                        return;
                    }

                    showLoading(`Mengunggah ${jsonData.length - 1} data siswa...`);

                    for (let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        if (row.length >= 4) {
                            const nisn = String(row[0]).trim();
                            const nama = String(row[1]).trim();
                            const kelas = String(row[2]).trim();
                            const password = String(row[3]).trim();

                            if (nisn && nama) {
                                await addDoc(collection(db, "data_siswa"), {
                                    nisn,
                                    nama,
                                    kelas,
                                    password
                                });
                            }
                        }
                    }

                    alert("Import data siswa via Excel berhasil!");
                    window.loadPage('kelola-siswa', null, false);
                } catch (err) {
                    alert("Gagal mengimpor Excel: " + err.message);
                } finally {
                    hideLoading();
                }
            };

            reader.readAsArrayBuffer(file);
        };

        // UPDATE PROFIL ADMIN
        window.updateProfilAdmin = async function(e) {
            e.preventDefault();
            const namaBaru = document.getElementById('editAdminNama').value.trim();
            const passBaru = document.getElementById('editAdminPassBaru').value.trim();
            const passKonfirm = document.getElementById('editAdminPassKonfirm').value.trim();
            const fileFoto = document.getElementById('inputFotoAdmin').files[0];

            if (passBaru !== "" && passBaru !== passKonfirm) {
                alert("Konfirmasi password baru tidak cocok!");
                return;
            }

            showLoading("Memperbarui profil admin...");
            try {
                let adminPayload = { nama: namaBaru };

                if (fileFoto) {
                    const base64Foto = await convertFileToBase64(fileFoto);
                    adminPayload.fotoProfil = base64Foto;
                    currentUser.fotoProfil = base64Foto;
                }

                if (passBaru !== "") {
                    if (auth.currentUser) {
                        await updatePassword(auth.currentUser, passBaru);
                    }
                }

                await setDoc(doc(db, "pengaturan", "admin"), adminPayload, { merge: true });
                currentUser.name = namaBaru;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));

                document.getElementById('userNameDisplay').innerText = namaBaru;
                if (currentUser.fotoProfil) {
                    document.getElementById('userAvatarImg').src = currentUser.fotoProfil;
                }

                alert("Profil Admin berhasil diperbarui!");
                window.loadPage('dashboard', null, false);
            } catch (err) {
                if (err.code === 'auth/requires-recent-login') {
                    alert("Demi keamanan, silakan keluar dan masuk kembali sebelum memperbarui password.");
                } else {
                    alert("Gagal memperbarui profil admin: " + err.message);
                }
            } finally {
                hideLoading();
            }
        };

        // SIMPAN DATA SEKOLAH & KOP
        window.simpanDataSekolah = async function(e) {
            e.preventDefault();
            const namaSekolah = document.getElementById('schNama').value.trim();
            const npsn = document.getElementById('schNpsn').value.trim();
            const alamat = document.getElementById('schAlamat').value.trim();
            const kepalaSekolah = document.getElementById('schKepsek').value.trim();
            const nipKepalaSekolah = document.getElementById('schNipKepsek').value.trim();

            const fileDaerah = document.getElementById('schLogoDaerahFile').files[0];
            const fileSekolah = document.getElementById('schLogoSekolahFile').files[0];

            showLoading("Menyimpan data sekolah...");

            try {
                const schoolDoc = await getDoc(doc(db, "pengaturan", "sekolah"));
                let existingData = schoolDoc.exists() ? schoolDoc.data() : {};

                let payload = {
                    namaSekolah,
                    npsn,
                    alamat,
                    kepalaSekolah,
                    nipKepalaSekolah,
                    logoDaerah: existingData.logoDaerah || '',
                    logoSekolah: existingData.logoSekolah || ''
                };

                if (fileDaerah) {
                    payload.logoDaerah = await convertFileToBase64(fileDaerah);
                }
                if (fileSekolah) {
                    payload.logoSekolah = await convertFileToBase64(fileSekolah);
                }

                await setDoc(doc(db, "pengaturan", "sekolah"), payload, { merge: true });
                alert("Data Sekolah dan Logo Kop Surat berhasil disimpan!");
                window.loadPage('data-sekolah', null, false);
            } catch (err) {
                alert("Gagal menyimpan data sekolah: " + err.message);
            } finally {
                hideLoading();
            }
        };
    </script>
