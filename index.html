<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Kebiasaan Anak Indonesia Hebat</title>
    
    <!-- Mencegah error favicon.ico di browser -->
    <link rel="shortcut icon" href="#">

    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (XLSX) untuk Import & Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- STYLESHEET (CSS) -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7fe;
            color: #2b3674;
        }

        /* Modal Login & Overlay */
        .login-modal, .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(17, 28, 68, 0.85);
            display: flex !important;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0px 15px 35px rgba(0, 0, 0, 0.2);
            text-align: left;
        }

        .login-card h2 {
            color: #4318ff;
            margin-bottom: 5px;
            text-align: center;
        }

        .login-card p {
            color: #707ebe;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e5f2;
            border-radius: 8px;
            outline: none;
            transition: border 0.2s;
            font-size: 0.95rem;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #4318ff;
        }

        /* Layout Utama */
        .app-container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* Sidebar Overlay (Mobile) */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
        }

        .sidebar-overlay.show {
            display: block;
        }

        /* Sidebar */
        .sidebar {
            width: 270px;
            background: #ffffff;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            color: #4318ff;
            margin-bottom: 20px;
        }

        .user-profile-summary {
            background: #f4f7fe;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .profile-avatar-container {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            overflow: hidden;
            border: 3px solid #4318ff;
            background: #e0e5f2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            background: #4318ff;
            color: white;
            font-size: 0.75rem;
            border-radius: 6px;
            font-weight: bold;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            color: #707ebe;
            text-decoration: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background-color: #4318ff;
            color: #ffffff;
        }

        .btn-logout {
            margin-top: 15px;
            padding: 12px;
            border: none;
            background: #ffecec;
            color: #ee5d50;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            width: 100%;
            text-align: center;
        }

        .btn-logout:hover {
            background: #ffd5d5;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto;
            width: 100%;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .toggle-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #2b3674;
        }

        .card {
            background: #ffffff;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.03);
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Tombol - Tombol Akses */
        .btn-primary {
            background: #4318ff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-primary:hover {
            background: #3311cc;
        }

        .btn-success {
            background: #01b574;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-success:hover {
            background: #009660;
        }

        .btn-warning {
            background: #ffb547;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-info {
            background: #00b5d8;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-danger {
            background: #ee5d50;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-danger:hover { background: #e03e2e; }

        /* Stats Grid & Table */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.02);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: #f4f7fe;
            color: #4318ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .custom-table th, .custom-table td {
            padding: 12px 15px;
            text-align: left;
            border: 1px solid #e0e5f2;
            font-size: 0.92rem;
        }

        .custom-table th {
            background-color: #f8fbff;
            color: #2b3674;
            font-weight: 600;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 5px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            cursor: pointer;
        }

        /* Area Cetak / Print Header */
        .print-header {
            display: none;
        }

        /* Style Khusus Tabel Hasil Cetak Jurnal */
        .print-journal-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            margin-top: 8px;
        }

        .print-journal-table th, .print-journal-table td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
            font-size: 0.9rem;
            color: #000;
        }

        .print-journal-table th {
            background-color: #f0f0f0;
            font-weight: bold;
            text-align: center;
        }

        /* Style Kartu Login Siswa (Grid Print) */
        .cards-grid-print {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .siswa-card-box {
            border: 2px solid #4318ff;
            border-radius: 10px;
            padding: 12px;
            background: #fff;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .siswa-card-box h4 {
            color: #4318ff;
            font-size: 0.95rem;
            border-bottom: 1px solid #e0e5f2;
            padding-bottom: 5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .siswa-card-box table {
            width: 100%;
            font-size: 0.85rem;
        }

        .siswa-card-box table td {
            padding: 3px 0;
            border: none;
        }

        @media print {
            .sidebar, .top-bar, .btn-primary, .btn-success, .btn-danger, .btn-warning, .btn-info, form, .no-print {
                display: none !important;
            }
            .main-content {
                padding: 0;
            }
            .card {
                box-shadow: none;
                border: none;
                padding: 0;
            }
            .print-header {
                display: flex !important;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 20px;
                border-bottom: 3px double #000;
                padding-bottom: 10px;
            }
            .print-header img {
                max-height: 80px;
                width: auto;
            }
            .print-header .header-text {
                text-align: center;
                flex-grow: 1;
                padding: 0 10px;
            }
            .print-header h2 {
                font-size: 1.4rem;
                color: #000;
                margin-bottom: 4px;
            }
            .print-header p {
                font-size: 0.85rem;
                color: #000;
            }
            .print-journal-table th {
                background-color: #e0e0e0 !important;
                -webkit-print-color-adjust: exact;
            }
            .cards-grid-print {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .siswa-card-box {
                border: 1.5px solid #000 !important;
                page-break-inside: avoid;
            }
            .siswa-card-box h4 {
                color: #000 !important;
                border-bottom-color: #000 !important;
            }
        }

        /* Perbaikan Tampilan Sidebar Khusus Layar Mobil / HP */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -270px;
                top: 0;
                height: 100vh;
                z-index: 999;
                box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            }
            .sidebar.show {
                left: 0;
            }
        }
    </style>
</head>
<body>

    <!-- MODAL LOGIN -->
    <div id="loginModal" class="login-modal">
        <div class="login-card">
            <h2><i class="fa-solid fa-graduation-cap"></i> Portal Masuk</h2>
            <p>Aplikasi 7 Kebiasaan Anak Indonesia Hebat</p>
            
            <form id="formLogin">
                <div class="form-group">
                    <label for="roleSelect">Masuk Sebagai:</label>
                    <select id="roleSelect">
                        <option value="admin">Admin Sekolah</option>
                        <option value="guru">Guru</option>
                        <option value="siswa" selected>Siswa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="usernameInput" id="labelUsername">NISN Siswa:</label>
                    <input type="text" id="usernameInput" placeholder="Masukkan NISN / ID..." required>
                </div>

                <div class="form-group">
                    <label for="passwordInput">Password:</label>
                    <input type="password" id="passwordInput" placeholder="Masukkan password..." required>
                </div>

                <!-- Tombol Lupa Password Admin -->
                <div id="forgotPasswordContainer" style="display: none; text-align: right; margin-top: -8px; margin-bottom: 12px;">
                    <a href="javascript:void(0)" onclick="window.modalLupaPasswordAdmin()" style="color: #4318ff; font-size: 0.85rem; text-decoration: none; font-weight: 600;">Lupa Password Admin?</a>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 5px; padding: 12px; font-size: 1rem; justify-content: center;">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk Aplikasi
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL EDIT SISWA (OLEH ADMIN/GURU) -->
    <div id="editSiswaModal" class="login-modal" style="display: none !important;">
        <div class="login-card">
            <h2><i class="fa-solid fa-user-pen"></i> Edit Data Siswa</h2>
            <form id="formEditSiswa" onsubmit="window.simpanEditSiswa(event)">
                <input type="hidden" id="editSiswaDocId">
                <div class="form-group">
                    <label>NISN Siswa:</label>
                    <input type="text" id="editNisnSiswa" required>
                </div>
                <div class="form-group">
                    <label>Nama Siswa:</label>
                    <input type="text" id="editNamaSiswa" required>
                </div>
                <div class="form-group">
                    <label>Kelas:</label>
                    <input type="text" id="editKelasSiswa" required>
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="text" id="editPassSiswa" required>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="btn-primary" style="flex: 1; justify-content: center;">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan
                    </button>
                    <button type="button" class="btn-danger" style="flex: 1; justify-content: center;" onclick="window.tutupEditSiswaModal()">
                        Batal
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL EDIT PROFIL MANDIRI SISWA (FOTO, NAMA, PASSWORD) -->
    <div id="editProfilSiswaModal" class="login-modal" style="display: none !important;">
        <div class="login-card">
            <h2><i class="fa-solid fa-id-badge"></i> Edit Profil Saya</h2>
            <form id="formEditProfilSiswa" onsubmit="window.simpanProfilSiswaMandiri(event)">
                <div class="form-group" style="text-align: center;">
                    <div class="profile-avatar-container" style="width: 90px; height: 90px;">
                        <img id="previewFotoProfil" src="https://via.placeholder.com/150?text=Foto" alt="Foto Profil">
                    </div>
                    <label for="inputFotoProfil" style="cursor: pointer; color: #4318ff; font-size: 0.85rem;">
                        <i class="fa-solid fa-camera"></i> Ubah Foto Profil
                    </label>
                    <input type="file" id="inputFotoProfil" accept="image/*" style="display: none;" onchange="window.previewFotoProfilSelected(event)">
                </div>

                <div class="form-group">
                    <label>Nama Lengkap:</label>
                    <input type="text" id="profilNamaSiswa" required>
                </div>

                <div class="form-group">
                    <label>Password Baru (Kosongkan jika tidak diubah):</label>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="btn-primary" style="flex: 1; justify-content: center;">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan
                    </button>
                    <button type="button" class="btn-danger" style="flex: 1; justify-content: center;" onclick="window.tutupEditProfilSiswaModal()">
                        Batal
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL EDIT PROFIL GURU (FOTO, NAMA, PASSWORD) -->
    <div id="editProfilGuruModal" class="login-modal" style="display: none !important;">
        <div class="login-card">
            <h2><i class="fa-solid fa-user-pen"></i> Edit Profil Guru</h2>
            <form id="formEditProfilGuru" onsubmit="window.simpanProfilGuruMandiri(event)">
                <div class="form-group" style="text-align: center;">
                    <div class="profile-avatar-container" style="width: 90px; height: 90px;">
                        <img id="previewFotoProfilGuru" src="https://via.placeholder.com/150?text=Guru" alt="Foto Profil Guru">
                    </div>
                    <label for="inputFotoProfilGuru" style="cursor: pointer; color: #4318ff; font-size: 0.85rem;">
                        <i class="fa-solid fa-camera"></i> Unggah / Ubah Foto Profil
                    </label>
                    <input type="file" id="inputFotoProfilGuru" accept="image/*" style="display: none;" onchange="window.previewFotoProfilGuruSelected(event)">
                </div>

                <div class="form-group">
                    <label>Nama Lengkap Guru:</label>
                    <input type="text" id="profilNamaGuru" required>
                </div>

                <div class="form-group">
                    <label>Password Baru (Kosongkan jika tidak diubah):</label>
                    <input type="password" id="profilPassGuru" placeholder="Masukkan password baru...">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="btn-primary" style="flex: 1; justify-content: center;">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan
                    </button>
                    <button type="button" class="btn-danger" style="flex: 1; justify-content: center;" onclick="window.tutupEditProfilGuruModal()">
                        Batal

    <!-- CONTAINER UTAMA APP -->
    <div class="app-container" id="appContainer" style="display: none;">
        <!-- OVERLAY SIDEBAR UNTUK HP -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <i class="fa-solid fa-graduation-cap fa-xl"></i>
                <h2>Anak Hebat</h2>
            </div>
            
            <div class="user-profile-summary">
                <div class="profile-avatar-container" id="sidebarAvatarContainer">
                    <img id="userAvatarImg" src="https://via.placeholder.com/150?text=User" alt="Avatar">
                </div>
                <span id="userRoleBadge" class="badge">SISWA</span>
                <h4 id="userNameDisplay" style="margin-top: 5px;">-</h4>
                <small id="userSubDetail" style="color:#707ebe; display:block; margin-top:3px;"></small>
                
                <!-- Tombol Edit Profil Siswa di Sidebar -->
                <button id="btnEditProfilSiswaSidebar" class="btn-info" style="margin-top: 8px; width: 100%; display: none;" onclick="window.bukaEditProfilSiswaModal()">
                    <i class="fa-solid fa-user-pen"></i> Edit Profil
                </button>
                <!-- Tombol Edit Profil Guru di Sidebar -->
                <button id="btnEditProfilGuruSidebar" class="btn-info" style="margin-top: 8px; width: 100%; display: none;" onclick="window.bukaEditProfilGuruModal()">
                    <i class="fa-solid fa-user-pen"></i> Edit Profil
                </button>
            </div>

            <nav class="nav-menu" id="navMenu">
                <!-- Navigasi Dinamis via JS -->
            </nav>

            <button class="btn-logout" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <header class="top-bar">
                <button class="toggle-btn" id="btnToggle"><i class="fa-solid fa-bars"></i></button>
                <h1 id="pageTitle">Dashboard</h1>
            </header>

            <section class="content-body" id="contentBody">
                <!-- Halaman dimuat di sini -->
            </section>
        </main>
    </div>

    <!-- SCRIPT FIREBASE & LOGIKA APLIKASI -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, where, getDoc, setDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { 
            getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updatePassword, sendPasswordResetEmail, signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Konfigurasi Firebase Proyek
        const firebaseConfig = {
            apiKey: "AIzaSyBvopp_GRWvaCH05Ol9XSaly98aRAcFAHA",
            authDomain: "sdn-129.firebaseapp.com",
            projectId: "sdn-129",
            storageBucket: "sdn-129.firebasestorage.app",
            messagingSenderId: "894009105564",
            appId: "1:894009105564:web:d7a9e131a2c0d767aee159",
            measurementId: "G-YKZ7RTM3BP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let allSiswaCache = []; // Cache lokal data siswa untuk fitur pencarian
        let currentPageName = 'dashboard';

        // Helper Konversi ID Ke Email Firebase Auth Internal
        function getFirebaseEmail(role, username) {
            const cleanUser = username.trim().toLowerCase().replace(/\s+/g, '');
            return `${role}_${cleanUser}@app.com`;
        }

        // Label Switcher pada Login
        document.getElementById('roleSelect').addEventListener('change', (e) => {
            const label = document.getElementById('labelUsername');
            const inputUser = document.getElementById('usernameInput');
            const forgotBtn = document.getElementById('forgotPasswordContainer');

            if (e.target.value === 'admin') {
                label.innerText = "Email Admin:";
                inputUser.placeholder = "Masukkan Email Admin...";
                forgotBtn.style.display = "block";
            } else if (e.target.value === 'guru') {
                label.innerText = "NIP Guru:";
                inputUser.placeholder = "Masukkan NIP / ID...";
                forgotBtn.style.display = "none";
            } else {
                label.innerText = "NISN Siswa:";
                inputUser.placeholder = "Masukkan NISN / ID...";
                forgotBtn.style.display = "none";
            }
        });

        // Fitur Lupa Password Admin via Firebase Reset Email
        window.modalLupaPasswordAdmin = async function() {
            const emailAdmin = prompt("Masukkan Email Admin untuk mengirimkan link reset password:");
            if (!emailAdmin) return;
            try {

        // Helper Tanggal & Hari
        function getHariIndo(dateStr) {
            if (!dateStr) return '-';
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const d = new Date(dateStr);
            return isNaN(d.getDay()) ? dateStr : days[d.getDay()];
        }

        // Helper Format Tanggal Lengkap (Hari, Tanggal Bulan Tahun)
        function formatTanggalLengkap(dateStr) {
            if (!dateStr) return '-';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]) - 1;
            const day = parseInt(parts[2]);
            
            const d = new Date(year, month, day);
            if (isNaN(d.getTime())) return dateStr;

            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

            const namaHari = days[d.getDay()];
            const tgl = d.getDate() < 10 ? '0' + d.getDate() : d.getDate();
            const namaBulan = monthNames[d.getMonth()];

            return `${namaHari}, ${tgl} ${namaBulan} ${d.getFullYear()}`;
        }

        window.renderTabelSiswaFiltered = function() {

            const filtered = allSiswaCache.filter(s => {
                const matchSearch = (s.nisn && s.nisn.toLowerCase().includes(searchVal)) || 
                                    (s.nama && s.nama.toLowerCase().includes(searchVal));

        // Hapus Banyak Siswa Sekaligus

            const selectedBoxes = document.querySelectorAll('.check-siswa-item:checked');
            if (selectedBoxes.length === 0) {
                alert("Pilih setidaknya satu siswa yang ingin dihapus!");
                return;
            }

            if (confirm(`Apakah Anda yakin ingin menghapus ${selectedBoxes.length} data siswa terpilih?`)) {
                try {
                    for (const cb of selectedBoxes) {
                        await deleteDoc(doc(db, "data_siswa", cb.value));

                    alert("Data siswa terpilih berhasil dihapus!");
                    window.loadPage('kelola-siswa', null, false);

                    alert("Gagal menghapus beberapa data siswa: " + err.message);

        window.simpanKebiasaanSpesifik = async function(e, type) {
            e.preventDefault();
            const dateVal = document.getElementById('kDate').value;
            let payload = {
                siswaId: currentUser.id,
                siswaNama: currentUser.name,
                tanggal: dateVal,
                created_at: new Date()
            };

            if (type === 'bangun-pagi') {
                payload.jam = document.getElementById('kJam').value;
            } else if (type === 'berolahraga') {
                payload.jenis = document.getElementById('kJenis').value;
                payload.durasi = document.getElementById('kDurasi').value;
                payload.keterangan = document.getElementById('kKet').value;
            } else if (type === 'beribadah') {
                payload.wajib = Array.from(document.querySelectorAll('input[name="sholatWajib"]:checked')).map(c => c.value);
                payload.sunnah = Array.from(document.querySelectorAll('input[name="sholatSunnah"]:checked')).map(c => c.value);
                payload.keterangan = document.getElementById('kKet').value;
            } else if (type === 'makan-sehat') {
                payload.menu = document.getElementById('kMenu').value;
                payload.keterangan = document.getElementById('kKet').value;
            } else if (type === 'gemar-belajar') {
                payload.materi = document.getElementById('kMateri').value;
                payload.kesimpulan = document.getElementById('kKesimpulan').value;
            } else if (type === 'bermasyarakat') {
                payload.kegiatan = document.getElementById('kKegiatan').value;
                payload.keterangan = document.getElementById('kKet').value;
            } else if (type === 'tidur-cepat') {
                payload.jamTidur = document.getElementById('kJamTidur').value;
                payload.keterangan = document.getElementById('kKet').value;
            }

            try {
                const targetCollection = collection(db, `kategori_${type}`);
                
                const checkQuery = query(
                    targetCollection,
                    where("siswaId", "==", currentUser.id),
                    where("tanggal", "==", dateVal)
                );
                const existingSnap = await getDocs(checkQuery);

                if (!existingSnap.empty) {
                    const existingDocId = existingSnap.docs[0].id;
                    await setDoc(doc(db, `kategori_${type}`, existingDocId), payload);
                    alert("Data pada tanggal ini sudah ada. Data lama telah diperbarui secara otomatis!");
                } else {
                    await addDoc(targetCollection, payload);
                    alert("Data kebiasaan berhasil disimpan!");
                }

                window.loadPage(`kebiasaan-${type}`, null, false);
            } catch (err) {
                alert("Gagal menyimpan data: " + err.message);
            }
        };

        window.importExcelSiswa = function() {
            const fileInput = document.getElementById('excelFileInput');
            if (!fileInput.files.length) {
                alert("Silakan pilih file Excel terlebih dahulu!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);

                    if (jsonData.length === 0) {
                        alert("File Excel kosong!");
                        return;
                    }

                    let counter = 0;
                    for (const row of jsonData) {
                        if (row.NISN && row.Nama) {
                            const nisnStr = String(row.NISN).trim();
                            const passStr = row.Password ? String(row.Password).trim() : '123456';

                            await addDoc(collection(db, "data_siswa"), {
                                nisn: nisnStr,
                                nama: String(row.Nama),
                                kelas: row.Kelas ? String(row.Kelas) : (currentUser.waliKelas || ''),
                                password: passStr
                            });

                            try {
                                const authEmail = getFirebaseEmail('siswa', nisnStr);
                                await createUserWithEmailAndPassword(auth, authEmail, passStr);
                            } catch (authErr) {
                                // Abaikan jika sudah ada
                            }

                            counter++;
                        }
                    }

                    alert(`Berhasil mengimpor ${counter} data siswa dari Excel!`);
                    window.loadPage('kelola-siswa', null, false);
                } catch (err) {
                    alert("Gagal memproses file Excel: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.updateProfilAdmin = async function(e) {
            e.preventDefault();

            const passBaru = document.getElementById('editAdminPassBaru').value.trim();
            const passKonfirm = document.getElementById('editAdminPassKonfirm').value.trim();
            const fileFoto = document.getElementById('inputFotoAdmin')?.files[0];

            if (passBaru !== "" && passBaru !== passKonfirm) {
                alert("Konfirmasi password baru tidak cocok!");

            }

            try {
                const userAuth = auth.currentUser;
                if (!userAuth) {

                }

                if (passBaru !== "") {

                }

                let updatePayload = { nama: namaBaru };
                if (fileFoto) {
                    const base64Foto = await convertFileToBase64(fileFoto);

                    <a href="javascript:void(0)" onclick="window.loadPage('kebiasaan-bangun-pagi')" class="nav-item" id="menu-kebiasaan-bangun-pagi">
                        <i class="fa-solid fa-sun"></i> 1. Bangun Pagi
                    </a>
                    <a href="javascript:void(0)" onclick="window.loadPage('kebiasaan-berolahraga')" class="nav-item" id="menu-kebiasaan-berolahraga">
                        <i class="fa-solid fa-person-running"></i> 2. Berolahraga
                    </a>
                    <a href="javascript:void(0)" onclick="window.loadPage('kebiasaan-beribadah')" class="nav-item" id="menu-kebiasaan-beribadah">
                        <i class="fa-solid fa-hands-praying"></i> 3. Beribadah
                    </a>
                    <a href="javascript:void(0)" onclick="window.loadPage('kebiasaan-makan-sehat')" class="nav-item" id="menu-kebiasaan-makan-sehat">
                        <i class="fa-solid fa-utensils"></i> 4. Makan Sehat
                    </a>
                    <a href="javascript:void(0)" onclick="window.loadPage('kebiasaan-gemar-belajar')" class="nav-item" id="menu-kebiasaan-gemar-belajar">
                        <i class="fa-solid fa-book-open"></i> 5. Gemar Belajar
                    </a>
                    <a href="javascript:void(0)" onclick="window.loadPage('kebiasaan-bermasyarakat')" class="nav-item" id="menu-kebiasaan-bermasyarakat">
                        <i class="fa-solid fa-people-hold"></i> 6. Bermasyarakat
                    </a>
                    <a href="javascript:void(0)" onclick="window.loadPage('kebiasaan-tidur-cepat')" class="nav-item" id="menu-kebiasaan-tidur-cepat">
                        <i class="fa-solid fa-bed"></i> 7. Tidur Cepat
                    </a>
                `;
            }

            navMenu.innerHTML = menuHTML;
        }

        // -------------------------------------------------------------
        // INITIALIZATION & EVENT LISTENERS
        // -------------------------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            const formLogin = document.getElementById('formLogin');
            const btnLogout = document.getElementById('btnLogout');
            const btnToggle = document.getElementById('btnToggle');
            const sidebarOverlay = document.getElementById('sidebarOverlay');

            if (formLogin) {
                formLogin.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const role = document.getElementById('roleSelect').value;
                    const username = document.getElementById('usernameInput').value.trim();
                    const password = document.getElementById('passwordInput').value.trim();

                    const btnSubmit = formLogin.querySelector('button[type="submit"]');
                    btnSubmit.disabled = true;

                    try {
                        let userValid = false;
                        let userData = null;

                        if (role === 'admin') {
                            const userCredential = await signInWithEmailAndPassword(auth, username, password);
                            const user = userCredential.user;

                            // Cek profil data admin jika pernah disimpan
                            const adminDoc = await getDoc(doc(db, "pengaturan", "admin_profil"));
                            const adminData = adminDoc.exists() ? adminDoc.data() : {};

                            userValid = true;
                            userData = { 
                                name: adminData.nama || user.displayName || user.email.split('@')[0], 
                                id: user.uid,
                                fotoProfil: adminData.fotoProfil || null
                            };
                        } 
                        else if (role === 'guru') {
                            const q = query(collection(db, "data_guru"), where("nip", "==", username), where("password", "==", password));
                            const querySnapshot = await getDocs(q);
                            if (!querySnapshot.empty) {
                                const authEmail = getFirebaseEmail('guru', username);
                                try {
                                    await signInWithEmailAndPassword(auth, authEmail, password);
                                } catch (authError) {
                                    try {
                                        await createUserWithEmailAndPassword(auth, authEmail, password);
                                    } catch (createErr) {
                                        // Abaikan jika error otentikasi internal
                                    }
                                }
                                userValid = true;
                                const gData = querySnapshot.docs[0].data();
                                userData = { 
                                    name: gData.nama, 
                                    id: querySnapshot.docs[0].id, 
                                    waliKelas: gData.waliKelas || '',
                                    fotoProfil: gData.fotoProfil || null,
                                    password: gData.password
                                };
                            } else {
                                alert("Password atau Username Guru salah/tidak ditemukan di database!");
                            }
                        } 
                        else if (role === 'siswa') {
                            const q = query(collection(db, "data_siswa"), where("nisn", "==", username), where("password", "==", password));
                            const querySnapshot = await getDocs(q);
                            if (!querySnapshot.empty) {
                                const authEmail = getFirebaseEmail('siswa', username);
                                try {
                                    await signInWithEmailAndPassword(auth, authEmail, password);
                                } catch (authError) {
                                    try {
                                        await createUserWithEmailAndPassword(auth, authEmail, password);
                                    } catch (createErr) {
                                        // Abaikan jika akun sudah ada di Firebase Auth
                                    }
                                }
                                userValid = true;
                                const d = querySnapshot.docs[0].data();
                                userData = { 
                                    name: d.nama, 
                                    id: querySnapshot.docs[0].id, 
                                    kelas: d.kelas, 
                                    fotoProfil: d.fotoProfil || null,
                                    password: d.password
                                };
                            } else {
                                alert("Password atau NISN Siswa salah/tidak ditemukan di database!");
                            }
                        }

                        if (userValid) {
                            currentUser = { 
                                role, 
                                name: userData.name, 
                                id: userData.id, 
                                kelas: userData.kelas || '', 
                                waliKelas: userData.waliKelas || '', 
                                fotoProfil: userData.fotoProfil || null, 
                                password: userData.password || '' 
                            };

                            document.getElementById('loginModal').style.setProperty('display', 'none', 'important');
                            document.getElementById('appContainer').style.display = 'flex';
                            document.getElementById('userRoleBadge').innerText = role.toUpperCase();
                            document.getElementById('userNameDisplay').innerText = userData.name;
                            
                            const subDetail = document.getElementById('userSubDetail');
                            const avatarContainer = document.getElementById('sidebarAvatarContainer');
                            const btnEditProfilSiswa = document.getElementById('btnEditProfilSiswaSidebar');
                            const btnEditProfilGuru = document.getElementById('btnEditProfilGuruSidebar');
                            const userAvatarImg = document.getElementById('userAvatarImg');

                            avatarContainer.style.display = 'flex';

                            if (role === 'guru') {
                                subDetail.innerText = userData.waliKelas ? ("Wali Kelas: " + userData.waliKelas) : "Guru";
                                btnEditProfilSiswa.style.display = 'none';
                                btnEditProfilGuru.style.display = 'block';
                                userAvatarImg.src = userData.fotoProfil || 'https://via.placeholder.com/150?text=Guru';
                            } else if (role === 'siswa') {
                                subDetail.innerText = "Kelas: " + (userData.kelas || '-');
                                btnEditProfilSiswa.style.display = 'block';
                                btnEditProfilGuru.style.display = 'none';
                                userAvatarImg.src = userData.fotoProfil || 'https://via.placeholder.com/150?text=Siswa';
                            } else {
                                subDetail.innerText = "Administrator";
                                btnEditProfilSiswa.style.display = 'none';
                                btnEditProfilGuru.style.display = 'none';
                                userAvatarImg.src = userData.fotoProfil || 'https://via.placeholder.com/150?text=Admin';
                            }

                            renderSidebarMenu();
                            window.history.pushState({ page: 'dashboard' }, '');
                            window.loadPage('dashboard', null, false);
                        }
                    } catch (err) {
                        alert("Error Login: " + err.message);
                    } finally {
                        btnSubmit.disabled = false;
                    }
                });
            }

            if (btnLogout) {
                btnLogout.addEventListener('click', async () => {
                    await signOut(auth);
                    currentUser = null;
                    document.getElementById('appContainer').style.display = 'none';
                    document.getElementById('loginModal').style.setProperty('display', 'flex', 'important');
                });
            }

            if (btnToggle) {
                btnToggle.addEventListener('click', () => {
                    document.getElementById('sidebar').classList.toggle('show');
                    document.getElementById('sidebarOverlay')?.classList.toggle('show');
                });
            }

            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', () => {
                    closeSidebarMobile();
                });
            }
        });
    </script>
</body>
</html>
